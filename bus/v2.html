<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09131c">
<meta name="app-version" content="bus-2.0.0">
<title>群辉 → 民辉 · 公交到站</title>
<link rel="stylesheet" href="./theme.v2.css">
</head>
<body>
<main class="wrap">
<header><div class="eyebrow">台州 · 公交到站预估</div><span class="version">v2.0.0 重构版</span></header>
<h1 id="heading">群辉 <span>→</span> 民辉</h1>
<p class="subtitle">先校验时间，再比较到站顺序。</p>
<details class="settings"><summary>更换上车站</summary>
<form id="query-form"><label>城市<input id="city" value="台州" required maxlength="20" autocomplete="off"></label><label>上车站<input id="site" value="群辉" required maxlength="40" autocomplete="off"></label><button type="submit">查询该站</button></form>
</details>
<div class="tabs" aria-label="车辆筛选"><button id="minhui" aria-pressed="true">民辉方向</button><button id="all" aria-pressed="false">全部方向</button></div>
<section id="winner" class="hero" data-state="loading"><div class="eyebrow">到站预估</div><h2>正在查询</h2><p>没有有效时间时，不推荐“最快一班”。</p></section>
<div id="status" class="status" role="status" aria-live="polite">准备连接数据源…</div>
<div class="list-title"><h2>车辆记录</h2><span id="count">—</span></div>
<section id="list" aria-label="到站记录"></section>
<details class="diagnostics"><summary>数据与连接状态</summary><div id="diagnostics"></div><p>获取时间不等于车辆定位更新时间。该接口没有提供定位更新时间，也没有提供完整途经站表；“民辉方向”仅匹配终点为民辉、民辉站或公交民辉站的记录。</p><a href="https://www.code410.com/api/231" target="_blank" rel="noopener noreferrer">查看数据源说明</a></details>
<footer>异常记录不参与推荐 · 旧数据不会倒数到零<br>请核对站牌终点方向，以运营方现场信息为准。<br><a id="latest" href="./v2.html">重新加载新版</a></footer>
</main>
<div class="dock"><div><span id="age">尚未获取数据</span><small id="next">自动刷新已开启</small></div><button id="pause" aria-pressed="false">暂停</button><button id="refresh" class="primary">立即刷新</button></div>
<noscript><p>请启用 JavaScript 后查询；这里不会使用静态样例冒充实时车辆。</p></noscript>
<script type="module" src="./app.v2.mjs"></script>
</body>
</html>
