<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>群辉 → 民辉 · 实时公交</title><style>:root{color-scheme:dark;--bg:#08111f;--card:#101a2b;--muted:#91a4c0;--line:#23324b;--green:#71e0a6;--blue:#4d82ff;--warn:#ffd47a;--red:#ff9e9e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08111f,#0b1322 42%,#0a1220);color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}.wrap{max-width:720px;margin:auto;padding:14px 14px calc(74px + env(safe-area-inset-bottom))}.card{background:rgba(16,26,43,.94);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 12px 34px #0004}.hero{padding-top:18px}.hero h1{margin:0;font-size:25px;letter-spacing:-.02em}.sub,.status,.tiny{color:var(--muted);font-size:13px;line-height:1.6}.sub{margin-top:7px}.winner{border-color:#2e7b59;background:linear-gradient(150deg,#0c2b20,#111c2c 72%);padding:18px}.label{font-size:12px;color:#93b9a4;letter-spacing:.08em}.winnerRow{display:flex;justify-content:space-between;gap:14px;align-items:flex-end}.etaBig{font-size:40px;font-weight:950;letter-spacing:-.04em;line-height:1.05;margin:5px 0;color:var(--green)}.routeBig{font-size:25px;font-weight:900;text-align:right}.meta{color:#bac9db;font-size:14px;line-height:1.65}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#173628;color:#aee8c5;font-size:12px;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.stale{background:#3d2e16;color:#ffd994}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:13px}.controls input,.controls button,.tabs button{min-height:44px;border-radius:13px;border:1px solid #30415f;background:#0b1525;color:#fff;padding:0 13px;font-size:15px}.controls button{background:var(--blue);border-color:var(--blue);font-weight:800}.tabs{display:flex;gap:8px;margin-top:9px}.tabs button{flex:1;font-weight:750}.tabs .active{background:#6644d8;border-color:#6644d8}.listHead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 4px;color:#adbed4;font-size:13px}.bus{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.lineName{font-size:21px;font-weight:900}.dest{font-size:13px;color:#aebed4;margin-top:3px}.eta{text-align:right}.eta b{font-size:24px;color:var(--green)}.eta span{display:block;font-size:12px;color:#8296b3;margin-top:3px}.near{border-color:#327a58;background:#10251e}.empty{text-align:center;color:#8ca0bb;padding:26px 12px}.err{color:var(--red)}.warn{color:var(--warn)}.foot{font-size:11px;color:#647895;text-align:center;line-height:1.65;margin-top:16px}.loading{opacity:.68}.spin{display:inline-block;width:12px;height:12px;border:2px solid #49607e;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;margin-right:6px;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}button{touch-action:manipulation}button:active{transform:scale(.985)}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.winnerRow{align-items:flex-start}.routeBig{font-size:22px}.etaBig{font-size:36px}}</style></head><body><main class="wrap"><section class="card hero"><h1>🚌 群辉 → 民辉</h1><div class="sub">打开就看最快一班。两个方向同时查，优先筛出目的地含“民辉”的实时车辆。</div><div class="controls"><input id="city" value="台州" aria-label="城市"><input id="site" value="群辉" aria-label="上车站"><button id="go">立即刷新</button></div><div class="tabs"><button id="toMinhui" class="active">只看去民辉</button><button id="all">全部方向</button></div></section><section id="winner"></section><section class="card"><div id="status" class="status"><span class="spin"></span>正在查询实时车辆…</div></section><div class="listHead"><span>实时车辆</span><span id="age"></span></div><section id="list"></section><div class="foot">每 20 秒自动刷新；切回页面会立即刷新。接口异常时会保留上一次成功结果，并明确标记为旧数据。</div></main><script>
const API='https://api.code410.com/api/traffic/bus';const $=s=>document.querySelector(s);let onlyMinhui=true,lastGood=null,lastUpdated=0,loading=false,seq=0;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const m=String(v??'').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):NaN}
function mins(v=''){const n=num(v);return Number.isFinite(n)?n:9999}
function saneDate(v){if(v===null||v===undefined||v==='')return null;let n=Number(v);let d;if(Number.isFinite(n)){if(n===0)return null;if(n>0&&n<1e12)n*=1000;d=new Date(n)}else d=new Date(v);if(Number.isNaN(d.getTime())||d.getFullYear()<2000||d.getFullYear()>2100)return null;return d}
function timeText(v){const d=saneDate(v);return d?d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}
function etaText(x){const raw=x.estimated_time??x.estimate_time??x.arrival_time??'';if(typeof raw==='number'&&raw>1e9){const d=saneDate(raw);if(!d)return'--';const m=Math.max(0,Math.round((d-Date.now())/60000));return m<=0?'即将到站':`${m}分钟`}const s=String(raw).trim();if(!s||/1970/.test(s))return'--';return s}
function arrivalText(x){for(const k of ['expected_arrival','expectedArrival','arrival_at','arrival_time','timestamp']){const v=x[k];if(v===undefined||v===null||v==='')continue;if(typeof v==='string'&&/1970/.test(v))continue;const t=timeText(v);if(t)return `预计 ${t}`;if(typeof v==='string'&&!/^\d+$/.test(v)&&v.length<40)return v}return''}
function isToMinhui(x){return /民辉/.test([x.destination,x.direction,x.end_station,x.terminal,x.route_name].filter(Boolean).join(' '))}
function flatten(j,direction){let rows=[];if(Array.isArray(j?.data))rows=j.data;else if(j?.data&&typeof j.data==='object'){for(const v of Object.values(j.data))if(Array.isArray(v))rows.push(...v)}return rows.map(x=>({...x,_direction:direction,_eta:etaText(x)}))}
async function fetchSide(city,site,backward){const u=new URL(API);u.searchParams.set('city',city);u.searchParams.set('site',site);if(backward)u.searchParams.set('backward','1');const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.code!==200)throw new Error(j.msg||'接口返回异常');return flatten(j,backward?'B':'A')}finally{clearTimeout(timer)}}
function rowHtml(x){const m=mins(x._eta),near=m<=5||/^([0-2])站/.test(String(x.remaining_stations||''));return `<article class="card bus ${near?'near':''}"><div><div class="lineName">${esc(x.line||x.route||'未知线路')}</div><div class="dest">开往 ${esc(x.destination||x.direction||x.end_station||'未知方向')} · ${esc(x._direction)}方向</div></div><div class="eta"><b>${esc(x._eta||'--')}</b><span>${esc(x.remaining_stations||x.stations_away||'')}${arrivalText(x)?' · '+esc(arrivalText(x)):''}</span></div></article>`}
function render(rows,stale=false,partial=''){rows=[...rows].sort((a,b)=>mins(a._eta)-mins(b._eta));const toMinhui=rows.filter(isToMinhui),shown=onlyMinhui?toMinhui:rows;const best=toMinhui[0];if(best){$('#winner').innerHTML=`<section class="card winner"><div class="label">最快去民辉</div><div class="winnerRow"><div><div class="etaBig">${esc(best._eta||'--')}</div><div class="meta">${esc(best.remaining_stations||best.stations_away||'')}${arrivalText(best)?' · '+esc(arrivalText(best)):''}</div></div><div class="routeBig">${esc(best.line||best.route||'未知线路')}</div></div><div class="pill ${stale?'stale':''}"><span class="dot"></span>${stale?'上次成功数据':'实时数据'}${partial?' · '+esc(partial):''}</div></section>`}else{$('#winner').innerHTML=`<section class="card empty">${stale?'上次成功结果里':'当前结果里'}暂时没有识别到去民辉的车辆。</section>`}$('#list').innerHTML=shown.length?shown.map(rowHtml).join(''):'<div class="card empty">暂无可显示的车辆。</div>';const t=lastUpdated?new Date(lastUpdated).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--';$('#status').className='status'+(stale?' warn':'');$('#status').textContent=`${stale?'接口异常，显示旧数据':'更新成功'} · ${t} · 共 ${rows.length} 条${toMinhui.length?` · 去民辉 ${toMinhui.length} 条`:''}`;updateAge()}
function updateAge(){if(!lastUpdated){$('#age').textContent='';return}const s=Math.max(0,Math.floor((Date.now()-lastUpdated)/1000));$('#age').textContent=s<60?`${s}秒前`:`${Math.floor(s/60)}分钟前`}
async function load(){if(loading)return;loading=true;const my=++seq,city=$('#city').value.trim()||'台州',site=$('#site').value.trim()||'群辉';$('#status').className='status loading';$('#status').innerHTML='<span class="spin"></span>正在同时查询两个方向…';try{const settled=await Promise.allSettled([fetchSide(city,site,false),fetchSide(city,site,true)]);if(my!==seq)return;const ok=settled.filter(x=>x.status==='fulfilled'),rows=ok.flatMap(x=>x.value);const fail=settled.filter(x=>x.status==='rejected');if(!rows.length)throw new Error(fail.map(x=>x.reason?.message||'请求失败').join(' / ')||'暂无数据');lastGood=rows;lastUpdated=Date.now();render(rows,false,fail.length?`1个方向失败`:``)}catch(e){if(my!==seq)return;if(lastGood){render(lastGood,true);$('#status').innerHTML=`接口暂时失败，保留上次结果 · ${esc(e.message)}`;$('#status').className='status warn'}else{$('#status').className='status err';$('#status').textContent='实时接口请求失败：'+e.message;$('#winner').innerHTML='<section class="card empty">暂时拿不到实时数据，请稍后重试。</section>';$('#list').innerHTML=''}}finally{if(my===seq)loading=false}}
$('#go').onclick=load;$('#toMinhui').onclick=()=>{onlyMinhui=true;$('#toMinhui').classList.add('active');$('#all').classList.remove('active');lastGood?render(lastGood,false):load()};$('#all').onclick=()=>{onlyMinhui=false;$('#all').classList.add('active');$('#toMinhui').classList.remove('active');lastGood?render(lastGood,false):load()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('online',load);setInterval(()=>{updateAge();if(!document.hidden)load()},20000);setInterval(updateAge,1000);load();
</script></body></html>
