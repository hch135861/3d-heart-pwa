<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>台州实时公交 · 群辉</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 80px}.card{background:#121b2d;border:1px solid #24314b;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0004}.hero h1{margin:0 0 8px;font-size:26px}.sub{color:#9eb0cb;font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.controls input,.controls button,.dir button{width:100%;min-height:46px;border-radius:14px;border:1px solid #31405e;background:#0d1525;color:#fff;padding:0 14px;font-size:16px}.controls button,.dir button{background:#2f6fed;border-color:#2f6fed;font-weight:700}.dir{display:flex;gap:8px;margin-top:10px}.dir button{background:#17233a;border-color:#31405e}.dir button.active{background:#7c3aed;border-color:#7c3aed}.status{font-size:14px;color:#9eb0cb}.bus{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.line{font-size:22px;font-weight:800}.dest{font-size:14px;color:#b6c4da}.eta{text-align:right}.eta b{font-size:26px;color:#77e0a7}.eta span{display:block;font-size:12px;color:#8fa3bf}.warn{color:#ffd37a}.err{color:#ff9b9b}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#20304a;color:#bcd0ec;font-size:12px;margin-top:5px}.near{border-color:#347d57;background:#10291f}.empty{text-align:center;color:#8fa3bf;padding:28px 10px}.foot{font-size:12px;color:#6f829f;text-align:center;margin-top:18px}a{color:#8bb8ff}@media(max-width:560px){.controls{grid-template-columns:1fr}.bus{grid-template-columns:1fr auto}.line{grid-column:1}.dest{grid-column:1}.eta{grid-column:2;grid-row:1/3}}</style></head><body><main class="wrap"><section class="card hero"><h1>🚌 台州实时公交</h1><div class="sub">默认查询：群辉站 · 自动按预计到站时间排序</div><div class="controls"><input id="city" value="台州" aria-label="城市"><input id="site" value="群辉" aria-label="站点"><button id="go">刷新实时公交</button></div><div class="dir"><button id="forward" class="active">方向 A</button><button id="backward">方向 B</button></div></section><section class="card"><div id="status" class="status">正在查询实时公交…</div></section><section id="list"></section><div class="foot">数据来自公开实时公交接口；请以上车站牌与官方临时调度为准。</div></main><script>const API='https://api.code410.com/api/traffic/bus';const $=s=>document.querySelector(s);let backward=false;function mins(v=''){const m=String(v).match(/\d+/);return m?+m[0]:9999}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isMinhui(x){return /民辉/.test((x.destination||'')+' '+(x.line||''))}async function load(){const city=$('#city').value.trim(),site=$('#site').value.trim();$('#status').textContent='正在查询 '+city+' · '+site+' 的实时车辆…';$('#status').className='status';$('#list').innerHTML='';const url=new URL(API);url.searchParams.set('city',city);url.searchParams.set('site',site);if(backward)url.searchParams.set('backward','1');try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),9000);const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.code!==200)throw new Error(j.msg||'接口返回异常');let rows=[];if(j.data&&typeof j.data==='object'){for(const v of Object.values(j.data))if(Array.isArray(v))rows.push(...v)}rows.sort((a,b)=>mins(a.estimated_time)-mins(b.estimated_time));$('#status').textContent='实时更新于 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · 共 '+rows.length+' 辆/线路';if(!rows.length){$('#list').innerHTML='<div class="card empty">暂时没有实时车辆数据，试试切换方向。</div>';return}$('#list').innerHTML=rows.map(x=>{const m=mins(x.estimated_time),near=m<=5||/^[0-2]站/.test(x.remaining_stations||'');return `<article class="card bus ${near?'near':''}"><div><div class="line">${esc(x.line)}</div><div class="dest">开往 ${esc(x.destination||'未知方向')}</div>${isMinhui(x)?'<span class="badge">可能去民辉方向</span>':''}</div><div></div><div class="eta"><b>${esc(x.estimated_time||'--')}</b><span>${esc(x.remaining_stations||'--')} · ${esc(x.expected_arrival||'')}</span></div></article>`}).join('')}catch(e){$('#status').className='status err';$('#status').innerHTML='实时接口请求失败：'+esc(e.message)+'。<br>如果是浏览器跨域限制，可点下方“直接查看接口”验证数据。';$('#list').innerHTML=`<div class="card"><a target="_blank" rel="noopener" href="${url}">直接查看 ${esc(city)} · ${esc(site)} 实时接口</a></div>`}}$('#go').onclick=load;$('#forward').onclick=()=>{backward=false;$('#forward').classList.add('active');$('#backward').classList.remove('active');load()};$('#backward').onclick=()=>{backward=true;$('#backward').classList.add('active');$('#forward').classList.remove('active');load()};load();setInterval(()=>{if(!document.hidden)load()},30000);</script></body></html>
