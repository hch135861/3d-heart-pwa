<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>群辉 → 民辉 · 实时公交</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 72px}.card{background:#121b2d;border:1px solid #24314b;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0004}.hero h1{margin:0 0 8px;font-size:25px}.sub,.status{color:#9eb0cb;font-size:14px;line-height:1.6}.top{border-color:#3a8f63;background:linear-gradient(145deg,#10291f,#121b2d)}.label{font-size:12px;color:#8fa3bf;letter-spacing:.08em}.big{font-size:34px;font-weight:900;margin:3px 0}.big em{font-style:normal;color:#77e0a7}.route{font-size:20px;font-weight:800}.meta{color:#b6c4da;font-size:14px;line-height:1.7}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-top:14px}.controls input,.controls button{min-height:46px;border-radius:14px;border:1px solid #31405e;background:#0d1525;color:#fff;padding:0 14px;font-size:16px}.controls button{background:#2f6fed;border-color:#2f6fed;font-weight:750}.tabs{display:flex;gap:8px;margin-top:10px}.tabs button{flex:1;min-height:42px;border-radius:13px;border:1px solid #31405e;background:#17233a;color:#dce7f7;font-weight:700}.tabs .active{background:#6d3de6;border-color:#6d3de6}.bus{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.line{font-size:21px;font-weight:850}.dest{font-size:13px;color:#aebed4;margin-top:3px}.eta{text-align:right}.eta b{font-size:25px;color:#77e0a7}.eta span{display:block;font-size:12px;color:#8fa3bf;margin-top:3px}.near{border-color:#347d57}.empty{text-align:center;color:#8fa3bf;padding:28px 10px}.err{color:#ff9b9b}.warn{color:#ffd37a}.foot{font-size:12px;color:#6f829f;text-align:center;line-height:1.6;margin-top:18px}a{color:#8bb8ff}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}}</style></head><body><main class="wrap"><section class="card hero"><h1>🚌 群辉 → 民辉</h1><div class="sub">自动同时查询两个方向，只显示去民辉/公交民辉站的实时车辆，并按最快到站排序。</div><div class="controls"><input id="city" value="台州" aria-label="城市"><input id="site" value="群辉" aria-label="上车站"><button id="go">立即刷新</button></div><div class="tabs"><button id="toMinhui" class="active">只看去民辉</button><button id="all">查看全部方向</button></div></section><section id="winner"></section><section class="card"><div id="status" class="status">正在查询两个方向的实时车辆…</div></section><section id="list"></section><div class="foot">每 20 秒自动刷新。实时数据来自公开公交接口；临时改道、交通拥堵等情况请以上车站牌及运营方信息为准。</div></main><script>const API='https://api.code410.com/api/traffic/bus';const $=s=>document.querySelector(s);let onlyMinhui=true;function mins(v=''){const m=String(v).match(/\d+/);return m?+m[0]:9999}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isToMinhui(x){return /民辉/.test(String(x.destination||''))}function flatten(j,direction){let rows=[];if(j&&j.data&&typeof j.data==='object'&&!Array.isArray(j.data)){for(const v of Object.values(j.data))if(Array.isArray(v))rows.push(...v)}return rows.map(x=>({...x,_direction:direction}))}async function fetchSide(city,site,backward){const u=new URL(API);u.searchParams.set('city',city);u.searchParams.set('site',site);if(backward)u.searchParams.set('backward','1');const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8500);try{const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.code!==200)throw new Error(j.msg||'接口返回异常');return flatten(j,backward?'B':'A')}finally{clearTimeout(timer)}}function rowHtml(x){const m=mins(x.estimated_time),near=m<=5||/^([0-2])站/.test(String(x.remaining_stations||''));return `<article class="card bus ${near?'near':''}"><div><div class="line">${esc(x.line||'未知线路')}</div><div class="dest">开往 ${esc(x.destination||'未知方向')} · 方向 ${esc(x._direction)}</div></div><div class="eta"><b>${esc(x.estimated_time||'--')}</b><span>${esc(x.remaining_stations||'--')} · ${esc(x.expected_arrival||'')}</span></div></article>`}async function load(){const city=$('#city').value.trim()||'台州',site=$('#site').value.trim()||'群辉';$('#status').className='status';$('#status').textContent='正在同时查询两个方向…';$('#winner').innerHTML='';$('#list').innerHTML='';try{const settled=await Promise.allSettled([fetchSide(city,site,false),fetchSide(city,site,true)]);let rows=settled.flatMap(x=>x.status==='fulfilled'?x.value:[]);const errors=settled.filter(x=>x.status==='rejected').map(x=>x.reason?.message||'请求失败');if(!rows.length&&errors.length)throw new Error(errors.join(' / '));rows.sort((a,b)=>mins(a.estimated_time)-mins(b.estimated_time));const toMinhui=rows.filter(isToMinhui);const shown=onlyMinhui?toMinhui:rows;const now=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#status').textContent=`更新于 ${now} · 两个方向共 ${rows.length} 条实时记录${toMinhui.length?` · 去民辉 ${toMinhui.length} 条`:''}`;if(toMinhui.length){const x=toMinhui[0];$('#winner').innerHTML=`<section class="card top"><div class="label">最快去民辉</div><div class="big"><em>${esc(x.estimated_time||'--')}</em></div><div class="route">${esc(x.line||'未知线路')}</div><div class="meta">${esc(x.remaining_stations||'--')} · 开往 ${esc(x.destination||'公交民辉站')}<br>${esc(x.expected_arrival||'')}</div></section>`}else if(onlyMinhui){$('#winner').innerHTML='<section class="card empty">当前实时结果里暂时没有“去民辉”方向的车辆。可能尚未发车、接口暂无车辆定位，或站名需要用官方名称。</section>'}if(!shown.length){$('#list').innerHTML='<div class="card empty">暂无可显示的实时车辆。</div>';return}$('#list').innerHTML=shown.map(rowHtml).join('')}catch(e){$('#status').className='status err';$('#status').innerHTML=`实时接口请求失败：${esc(e.message)}。<br>页面已部署正常，问题来自实时数据接口或浏览器跨域限制。`;const u=new URL(API);u.searchParams.set('city',city);u.searchParams.set('site',site);$('#list').innerHTML=`<div class="card"><a target="_blank" rel="noopener" href="${u}">直接打开实时接口测试</a></div>`}}$('#go').onclick=load;$('#toMinhui').onclick=()=>{onlyMinhui=true;$('#toMinhui').classList.add('active');$('#all').classList.remove('active');load()};$('#all').onclick=()=>{onlyMinhui=false;$('#all').classList.add('active');$('#toMinhui').classList.remove('active');load()};load();setInterval(()=>{if(!document.hidden)load()},20000);</script></body></html>
