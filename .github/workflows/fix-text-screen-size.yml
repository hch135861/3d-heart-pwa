name: Fix Luobu Text Screen Size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-text-screen-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock text to baseline screen size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('3D-爱心-V3.10-洛布辛苦啦.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'savedOffset.subVectors(savedCameraPos, savedTarget); frontOffset.subVectors(frontCameraPos, frontTarget); savedRadius = savedOffset.length(); frontRadius = savedRadius;',
                  'savedOffset.subVectors(savedCameraPos, savedTarget); frontOffset.subVectors(frontCameraPos, frontTarget); savedRadius = savedOffset.length(); frontRadius = frontOffset.length(); // 文字阶段固定基准镜头距离，不继承爱心缩放后的距离'
              ),
              (
                  'heart.scale.setScalar(1.035 - p*0.035); flashSprite.material.opacity = Math.sin(Math.PI*p)*0.10;',
                  'heart.scale.setScalar(1.0); // 文字形成阶段固定整体缩放，避免文字跟随爱心放大\n        flashSprite.material.opacity = Math.sin(Math.PI*p)*0.10;'
              ),
              (
                  'starU.uGlow.value = Math.max(starU.uGlow.value, 0.22); heart.scale.setScalar(1 + Math.sin(el*2.0)*0.006); if (p >= 1) setState(\'back\', el);',
                  'starU.uGlow.value = Math.max(starU.uGlow.value, 0.22); heart.scale.setScalar(1.0); // 文字停留阶段保持截图基准大小\n        if (p >= 1) setState(\'back\', el);'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3D-爱心-V3.10-洛布辛苦啦.html'
          git commit -m 'Keep 洛布辛苦啦 at fixed baseline screen size'
          git push
