name: Fit Luobu Heart To Screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fit-luobu-heart-screen.yml'

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make heart fill screen width without changing text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('3D-爱心-V3.10-洛布辛苦啦.html')
          s = p.read_text(encoding='utf-8')
          old = "const COUNT = 50000, SC = 0.18432; // 洛布版：在当前基础上再缩小 1/3"
          new = "\n".join([
              "const COUNT = 50000;",
              "const HEART_BASE_SC = 0.18432;",
              "const HEART_TARGET_SCREEN_FILL = 0.90; // 爱心左右边缘目标约占屏幕宽度 90%",
              "function calcHeartScaleForScreen() {",
              "    const distance = camera.position.distanceTo(controls.target);",
              "    const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * distance;",
              "    const visibleWidth = visibleHeight * camera.aspect;",
              "    const fitSC = (visibleWidth * HEART_TARGET_SCREEN_FILL) / 32; // 心形参数横向理论宽度约 32",
              "    return Math.max(HEART_BASE_SC, fitSC); // 只放大，不再缩小",
              "}",
              "const SC = calcHeartScaleForScreen(); // 只作用于爱心坐标，文字 textPos 保持原尺寸",
          ])
          if old not in s:
              raise SystemExit('Target scale line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3D-爱心-V3.10-洛布辛苦啦.html'
          git commit -m 'Fit 洛布 heart closer to screen edges while keeping text size'
          git push
