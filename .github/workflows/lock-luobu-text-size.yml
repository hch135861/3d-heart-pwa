name: Lock Luobu Text Size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-luobu-text-size.yml'

permissions:
  contents: write

jobs:
  lock-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate heart scale from text scale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('3D-爱心-V3.10-洛布辛苦啦.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'const SC = calcHeartScaleForScreen(); // 只作用于爱心坐标，文字 textPos 保持原尺寸',
                  'const HEART_SC = calcHeartScaleForScreen(); // 爱心专用缩放；与文字尺寸彻底分离'
              ),
              (
                  'pos[i3] = x*SC; pos[i3+1] = y*SC; pos[i3+2] = z*SC*0.9;',
                  'pos[i3] = x*HEART_SC; pos[i3+1] = y*HEART_SC; pos[i3+2] = z*HEART_SC*0.9;'
              ),
              (
                  "const LOVE_TEXT = '洛布辛苦啦';",
                  "const LOVE_TEXT = '洛布辛苦啦';\nconst TEXT_FIXED_WORLD_WIDTH = 12.4; // 固定为当前最小文字尺寸，永不跟随爱心缩放"
              ),
              (
                  'const sx = 12.4 / tc.width;',
                  'const sx = TEXT_FIXED_WORLD_WIDTH / tc.width; // 文字只使用固定尺寸，不引用 HEART_SC'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3D-爱心-V3.10-洛布辛苦啦.html'
          git commit -m 'Lock 洛布辛苦啦 text size independently from heart scale'
          git push
