name: Shrink Luobu Heart One Third

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shrink-luobu-third.yml'

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shrink heart by one third
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('3D-爱心-V3.10-洛布辛苦啦.html')
          s = p.read_text(encoding='utf-8')
          old = 'const COUNT = 50000, SC = 0.27648; // 洛布版：在当前基础上再缩小 20%'
          new = 'const COUNT = 50000, SC = 0.18432; // 洛布版：在当前基础上再缩小 1/3'
          if old not in s:
              raise SystemExit('Target scale line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3D-爱心-V3.10-洛布辛苦啦.html'
          git commit -m 'Shrink 洛布 heart by one third'
          git push
