name: Create Luobu Short URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-luobu-short-url.yml'

permissions:
  contents: write

jobs:
  copy-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create short URL page
        run: |
          cp '3D-爱心-V3.10-洛布辛苦啦.html' luobu.html
      - name: Commit short URL page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luobu.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add short luobu.html page'
            git push
          fi
