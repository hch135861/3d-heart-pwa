name: Shrink Luobu Text 40 Percent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shrink-luobu-text-40.yml'

permissions:
  contents: write

jobs:
  shrink-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shrink fixed text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('3D-爱心-V3.10-洛布辛苦啦.html')
          s = p.read_text(encoding='utf-8')
          old = "const TEXT_FIXED_WORLD_WIDTH = 12.4; // 固定为当前最小文字尺寸，永不跟随爱心缩放"
          new = "const TEXT_FIXED_WORLD_WIDTH = 7.44; // 在截图基准文字尺寸上缩小 40%，仍永不跟随爱心缩放"
          if old not in s:
              raise SystemExit('Target text-size line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3D-爱心-V3.10-洛布辛苦啦.html'
          git commit -m 'Shrink 洛布辛苦啦 text by 40 percent'
          git push
