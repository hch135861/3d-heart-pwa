<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3D 爱心">
    <link rel="manifest" href="./luobu.webmanifest">
    <meta name="description" content="送给洛布的一颗心：星尘散开，汇成一句洛布辛苦啦。">
    <meta name="app-version" content="3.12-luobu">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <title>3D 爱心 · 洛布辛苦啦</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #050510; }
        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%; height: 100%;
            width: 100dvi; height: 100dvb;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        [hidden] { display: none !important; }
        button { font: inherit; cursor: pointer; touch-action: manipulation; }
        button:focus-visible, canvas:focus-visible { outline: 2px solid #ffc6e9; outline-offset: -3px; }
        button:disabled { opacity: .5; cursor: default; }
        #hud { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left));
            right: max(12px, env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
            text-align: center; pointer-events: none; }
        .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .actions button, #retry { min-height: 44px; padding: 9px 16px; border-radius: 24px;
            color: #f9dcec; background: rgba(23,15,37,.76); border: 1px solid rgba(255,195,229,.24);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: auto; }
        #replay { background: rgba(92,34,83,.65); }
        #retry { margin-top: 22px; }
        #loading.error { pointer-events: auto; }
        #loading.error p { opacity: .9; line-height: 1.8; max-width: 80vw; letter-spacing: 1px; }
        #loading.error .loader-heart { animation: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
        #loading {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #050510; color: #fff;
            transition: opacity 0.65s ease-out; pointer-events: none;
        }
        #loading.hide { opacity: 0; }
        .loader-heart { font-size: 48px; animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        #loading p { margin-top: 14px; font-size: 12px; letter-spacing: 3px; opacity: 0.25; font-weight: 300; }
        #install-hint { color: #bd9eb6; font-size: 11px; line-height: 1.7;
            margin: 0 auto 10px; max-width: 100%; letter-spacing: 1px; }

    </style>
</head>
<body>
<div id="loading" role="status"><div class="loader-heart" aria-hidden="true">💗</div>
    <p id="load-message">正在为洛布点亮星光</p><button id="retry" type="button" hidden>重新加载</button></div>
<div id="hud">
    <p id="install-hint">轻点爱心 · 滑动旋转 · 双指缩放</p>
    <div class="actions" aria-label="爱心互动">
        <button id="replay" type="button" disabled>播放心意</button>
        <button id="reset-view" type="button" disabled>回到正面</button>
        <button id="pause" type="button" aria-pressed="false" disabled>暂停</button>
    </div>
</div>
<p id="story-status" class="sr-only" role="status" aria-live="polite"></p>
<noscript><p style="position:fixed;inset:35% 20px;z-index:101;color:#fff;text-align:center">洛布辛苦啦 💗<br>请启用 JavaScript 查看粒子爱心。</p></noscript>
<script>
window.showHeartError = function (message) {
    const panel = document.getElementById('loading');
    panel.hidden = false; panel.classList.remove('hide'); panel.classList.add('error');
    document.getElementById('load-message').textContent = message;
    document.getElementById('retry').hidden = false;
};
document.getElementById('retry').addEventListener('click', () => location.reload());
window.heartLoadTimer = setTimeout(() => window.showHeartError('星光还没准备好，请检查网络后重新加载。'), 15000);
</script>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
</script>
<script type="module">
try {
const [THREE, { OrbitControls }] = await Promise.all([
    import('three'), import('three/addons/controls/OrbitControls.js')
]);
// 中文采样使用设备自己的字体，不下载外部字体或追踪资源。
if (document.fonts) await document.fonts.ready;
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = motionQuery.matches;
const coarsePointer = matchMedia('(pointer: coarse)').matches;
let pixelRatioCap = coarsePointer ? 1.5 : 2;
const BASE_CAMERA_DISTANCE = Math.hypot(12, 1.2);
const replayButton = document.getElementById('replay');
const resetButton = document.getElementById('reset-view');
const pauseButton = document.getElementById('pause');
const storyStatus = document.getElementById('story-status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.00006);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: !coarsePointer, alpha: false, powerPreference: 'default' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, pixelRatioCap));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute('role', 'img');
renderer.domElement.setAttribute('aria-label', '送给洛布的三维粒子爱心。拖动旋转，按回车播放心意。');

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
const AUTO_ROTATE_SPEED = 1.55;
controls.autoRotate = !reducedMotion;
controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
controls.minDistance = 3.5;
controls.maxDistance = 60;
controls.enablePan = false;
controls.target.set(0, 0.3, 0);
controls.update();

scene.add(new THREE.AmbientLight(0x2233aa, 0.35));
const l1 = new THREE.DirectionalLight(0xff88cc, 0.7); l1.position.set(3, 9, 5); scene.add(l1);
const l2 = new THREE.DirectionalLight(0x4488ff, 0.45); l2.position.set(-4, -3, -6); scene.add(l2);
const l3 = new THREE.DirectionalLight(0x88ddff, 0.35); l3.position.set(0, -5, 8); scene.add(l3);
const burstLight = new THREE.PointLight(0xffc8f3, 0, 14, 2); burstLight.position.set(0, 0.8, 2.5); scene.add(burstLight);

// 50,000 粒子。位置动画由 GPU Shader 完成，CPU 不再逐帧重写 15 万个浮点数。
const COUNT = 50000;
const HEART_TARGET_SCREEN_FILL = 0.90;
function calcHeartScaleForScreen() {
    // 以基准镜头计算，避免窗口变化抵消用户的双指缩放；宽高同时限幅。
    const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * BASE_CAMERA_DISTANCE;
    const widthFit = visibleHeight * camera.aspect * HEART_TARGET_SCREEN_FILL / 32;
    const heightFill = Math.min(0.72, Math.max(0.35, (innerHeight - 150) / innerHeight));
    return Math.max(0.01, Math.min(widthFit, visibleHeight * heightFill / 34));
}
let HEART_SC = calcHeartScaleForScreen(); // 爱心尺寸与文字尺寸保持分离
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(COUNT * 3);
const burstPos = new Float32Array(COUNT * 3);
const textPos = new Float32Array(COUNT * 3);
const col = new Float32Array(COUNT * 3);
const sizes = new Float32Array(COUNT);
const seeds = new Float32Array(COUNT);
const delays = new Float32Array(COUNT);

const C1 = [0.01, 0.80, 1.0], C2 = [0.72, 0.58, 0.96], C3 = [1.0, 0.44, 0.81], C4 = [1.0, 0.42, 0.62];
const lerp = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const hr = p => 16 * Math.pow(Math.sin(p), 3);
const hy = p => 13*Math.cos(p) - 5*Math.cos(2*p) - 2*Math.cos(3*p) - Math.cos(4*p);

let i = 0, it = 0;
while (i < COUNT && it < COUNT * 3) {
    const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI;
    const x = hr(ph) * Math.cos(th), y = hy(ph);
    if (y > 9.5 && y > 0.55*x*x + 10.8) { it++; continue; }
    const d = Math.sqrt(x*x + y*y) / 15;
    const z = (Math.random() - 0.5) * Math.sqrt(Math.max(0, 1 - d*d)) * 12;
    const i3 = i * 3;
    pos[i3] = x*HEART_SC; pos[i3+1] = y*HEART_SC; pos[i3+2] = z*HEART_SC*0.9;

    const t = Math.min(1, Math.abs(y) / 7);
    const c = y > 0 ? lerp(C1, C2, t*0.65) : lerp(C3, C4, t*0.75);
    const br = 1.35 + Math.random()*0.55;
    col[i3]=c[0]*br; col[i3+1]=c[1]*br; col[i3+2]=c[2]*br;
    sizes[i] = 0.035 + Math.random()*0.045;
    if (Math.abs(z) < 2.5) sizes[i] += 0.015;
    if (Math.abs(z) < 0.5) sizes[i] += 0.01;
    seeds[i] = Math.random();
    delays[i] = Math.random();
    i++; it++;
}

for (let n = 0; n < COUNT; n++) {
    const n3 = n * 3;
    const x = pos[n3], y = pos[n3+1], z = pos[n3+2];
    const len = Math.hypot(x, y, z) || 1;
    let dx = x / len + (Math.random() - 0.5) * 0.86;
    let dy = y / len + (Math.random() - 0.42) * 0.88;
    let dz = z / len + (Math.random() - 0.5) * 1.18;
    const dl = Math.hypot(dx, dy, dz) || 1;
    dx /= dl; dy /= dl; dz /= dl;
    const power = 4.6 + Math.random() * 8.2;
    burstPos[n3]   = x + dx * power;
    burstPos[n3+1] = y + dy * power + Math.random() * 1.35;
    burstPos[n3+2] = z + dz * power;
}

const LOVE_TEXT = '洛布辛苦啦';
const TEXT_FIXED_WORLD_WIDTH = 7.44; // 在截图基准文字尺寸上缩小 40%，仍永不跟随爱心缩放
function buildTextTargets(message) {
    const tc = document.createElement('canvas');
    tc.width = 1220; tc.height = 300;
    const tx = tc.getContext('2d', { willReadFrequently: true });
    tx.clearRect(0, 0, tc.width, tc.height);
    tx.fillStyle = '#fff';
    tx.textAlign = 'center';
    tx.textBaseline = 'middle';
    tx.font = '900 194px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
    tx.fillText(message, tc.width/2, tc.height/2 + 4);
    const data = tx.getImageData(0, 0, tc.width, tc.height).data;
    const pts = [];
    const step = 4;
    for (let y=0; y<tc.height; y+=step) {
        for (let x=0; x<tc.width; x+=step) {
            if (data[(y*tc.width+x)*4+3] > 100) pts.push([x,y]);
        }
    }
    if (!pts.length) throw new Error('无法生成中文粒子，请重试。');
    for (let k=pts.length-1; k>0; k--) {
        const j=(Math.random()*(k+1))|0; [pts[k],pts[j]]=[pts[j],pts[k]];
    }
    const sx = TEXT_FIXED_WORLD_WIDTH / tc.width; // 文字只使用固定尺寸，不引用 HEART_SC
    const sy = sx;
    for (let n=0; n<COUNT; n++) {
        const p = pts[n % pts.length];
        const n3=n*3;
        textPos[n3]   = (p[0]-tc.width/2)*sx + (Math.random()-0.5)*0.052;
        textPos[n3+1] = (tc.height/2-p[1])*sy + (Math.random()-0.5)*0.052;
        textPos[n3+2] = (Math.random()-0.5)*0.62;
    }
}
buildTextTargets(LOVE_TEXT);

geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aBurstPosition', new THREE.BufferAttribute(burstPos, 3));
geo.setAttribute('aTextPosition', new THREE.BufferAttribute(textPos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
geo.setAttribute('aDelay', new THREE.BufferAttribute(delays, 1));
geo.computeBoundingSphere();

const heartU = {
    uTime: { value: 0 }, uPhase: { value: 0 }, uProgress: { value: 0 },
    uFlash: { value: 0 }, uEnergy: { value: 0 }, uTextGlow: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() }
};

const heartMat = new THREE.ShaderMaterial({
    uniforms: heartU,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
        attribute float size; attribute vec3 color; attribute vec3 aBurstPosition;
        attribute vec3 aTextPosition; attribute float aSeed; attribute float aDelay;
        varying vec3 vC; varying float vSpark;
        uniform float uTime; uniform float uPhase; uniform float uProgress;
        uniform float uFlash; uniform float uEnergy; uniform float uTextGlow; uniform float uPixelRatio;
        float easeOutCubic(float t) { return 1.0 - pow(1.0 - t, 3.0); }
        float easeInOutCubic(float t) { return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t + 2.0, 3.0) / 2.0; }
        mat2 rot(float a) { float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
        void main() {
            vC = color; vSpark = step(0.86, aSeed); vec3 p = position; float burstMix = 0.0;
            if (uPhase > 1.5 && uPhase < 2.5) {
                float localP = clamp((uProgress - aDelay * 0.13) / 0.87, 0.0, 1.0);
                burstMix = easeOutCubic(localP); p = mix(position, aBurstPosition, burstMix);
            } else if (uPhase > 2.5 && uPhase < 3.5) {
                burstMix = 1.0; p = aBurstPosition;
                float drift = sin(uTime * (1.5 + aSeed) + aSeed * 19.0) * 0.08;
                p += normalize(aBurstPosition + vec3(0.01)) * drift;
            } else if (uPhase > 3.5 && uPhase < 4.5) {
                float localP = clamp((uProgress - aDelay * 0.12) / 0.88, 0.0, 1.0);
                float m = easeInOutCubic(localP); p = mix(aBurstPosition, aTextPosition, m);
                float arc = sin(m * 3.14159265); p.y += arc * (aSeed - 0.5) * 1.5;
                p.xz = rot(arc * (aSeed - 0.5) * 1.8) * p.xz;
            } else if (uPhase > 4.5 && uPhase < 5.5) {
                p = aTextPosition; p.z += sin(uTime*2.2 + aSeed*20.0) * 0.055;
            } else if (uPhase > 5.5 && uPhase < 6.5) {
                float localP = clamp((uProgress - aDelay * 0.08) / 0.92, 0.0, 1.0);
                float back = easeInOutCubic(localP); p = mix(aTextPosition, position, back);
                float swirl = sin(back * 3.14159265); float turns = (0.62 + aSeed * 1.0) * 6.2831853;
                p.xz = rot(swirl * turns) * p.xz;
                p.y += sin((back * 3.2 + aSeed * 5.0) * 6.2831853) * swirl * 0.24;
            }
            float hero = vSpark * (0.55 + uEnergy * 1.65);
            float textBoost = uTextGlow * 0.30; vec4 mv = modelViewMatrix * vec4(p, 1.0);
            float pointScale = 1.0 + uFlash * 0.75 + hero * uEnergy + textBoost;
            gl_PointSize = min(40.0 * uPixelRatio, size * pointScale * (150.0 * uPixelRatio / max(0.5, -mv.z)));
            gl_Position = projectionMatrix * mv;
        }`,
    fragmentShader: `
        varying vec3 vC; varying float vSpark; uniform float uTime; uniform float uFlash;
        uniform float uEnergy; uniform float uTextGlow;
        void main() {
            float d = distance(gl_PointCoord, vec2(0.5)); if (d > 0.5) discard;
            float a = 1.0 - smoothstep(0.0, 0.49, d); float g = exp(-d * 6.0);
            float shimmer = 1.02 + sin(uTime*1.5 + vC.r*20.0)*0.04;
            vec3 c = vC + vec3(0.5, 0.25, 0.7)*g*0.55;
            c = mix(c, vec3(1.0, 0.91, 1.0), clamp(uFlash, 0.0, 1.0) * 0.82);
            c += vec3(0.55, 0.20, 0.65) * vSpark * uEnergy * 0.75;
            c = mix(c, vec3(1.0, 0.68, 0.91) + vec3(g*0.22), clamp(uTextGlow,0.0,1.0)*0.72);
            gl_FragColor = vec4(c, a * shimmer * (1.0 + uEnergy*0.12));
        }`
});

const heart = new THREE.Points(geo, heartMat); heart.position.y = 0.8; scene.add(heart);
heart.frustumCulled = false; // GPU 爆散范围超出静态几何包围球，不能用旧范围剔除。
let textHalfWidth = 0;
for (let k = 0; k < textPos.length; k += 3) textHalfWidth = Math.max(textHalfWidth, Math.abs(textPos[k]));
function getStoryRadius() {
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
    return Math.max(BASE_CAMERA_DISTANCE, textHalfWidth / (tan * camera.aspect * 0.84) + 0.8);
}

const SC2 = 900;
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(SC2*3), ss = new Float32Array(SC2), sc = new Float32Array(SC2*3);
for (let n=0; n<SC2; n++) {
    const r = 12+Math.random()*35, ta = Math.random()*Math.PI*2, pa = Math.acos(2*Math.random()-1);
    sp[n*3]=r*Math.sin(pa)*Math.cos(ta); sp[n*3+1]=r*Math.cos(pa)*0.55; sp[n*3+2]=r*Math.sin(pa)*Math.sin(ta)-8;
    ss[n] = 0.015+Math.random()*0.07; const tc = Math.random()*0.4;
    sc[n*3]=0.27+tc*0.26; sc[n*3+1]=0.27+tc*0.13; sc[n*3+2]=0.53+tc*0.47;
}
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
sg.setAttribute('size', new THREE.BufferAttribute(ss, 1));
sg.setAttribute('color', new THREE.BufferAttribute(sc, 3));
const starU = { uGlow: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } };
const stars = new THREE.Points(sg, new THREE.ShaderMaterial({
    uniforms: starU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC; uniform float uGlow; uniform float uPixelRatio; void main(){vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*(1.0+uGlow*0.7)*(110.0*uPixelRatio/max(0.5,-mv.z)); gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `varying vec3 vC; uniform float uGlow; void main(){float d=distance(gl_PointCoord,vec2(0.5)); if(d>0.5)discard; vec3 c=vC*(1.0+uGlow*2.1); gl_FragColor=vec4(c,exp(-d*8.0)*(0.4+uGlow*0.24));}`
}));
scene.add(stars);

const gg = new THREE.RingGeometry(2.5, 6, 64); const gu = { uTime: { value: 0 } };
const gm = new THREE.Mesh(gg, new THREE.ShaderMaterial({
    uniforms: gu, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec2 vUv; uniform float uTime; void main(){float d=length(vUv-0.5)*2.0; float a=exp(-d*2.5)*0.07+sin(uTime*0.3)*0.015; gl_FragColor=vec4(0.27,0.13,0.67,a);}`
}));
gm.position.set(0, -3.2, -2); gm.rotation.x = -0.3; scene.add(gm);

const shock = new THREE.Mesh(
    new THREE.RingGeometry(0.92, 1.0, 128),
    new THREE.MeshBasicMaterial({ color: 0xffa6ec, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
);
shock.position.set(0, 0.8, 0.25); shock.scale.setScalar(0.05); shock.visible = false; scene.add(shock);

const glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 128;
const gctx = glowCanvas.getContext('2d'); const grad = gctx.createRadialGradient(64,64,0,64,64,64);
grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.18, 'rgba(255,220,247,.92)');
grad.addColorStop(0.48, 'rgba(255,105,210,.30)'); grad.addColorStop(1, 'rgba(120,70,255,0)');
gctx.fillStyle = grad; gctx.fillRect(0,0,128,128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
flashSprite.position.set(0, 0.8, 1.0); flashSprite.scale.set(0.1,0.1,1); scene.add(flashSprite);

let elapsed = 0, lastFrame = null, rafId = null;
let burstState = 'idle', burstStart = 0, shake = 0;
let hidden = document.hidden, paused = false, contextLost = false, tmr = null;
let frameSamples = 0, frameTotal = 0, qualityCheckAt = 0;
const savedCameraPos = new THREE.Vector3(); const savedTarget = new THREE.Vector3();
const frontCameraPos = new THREE.Vector3(0, 1.5, 12); const frontTarget = new THREE.Vector3(0, 0.3, 0);
const camTargetTmp = new THREE.Vector3(); const savedOffset = new THREE.Vector3(); const frontOffset = new THREE.Vector3();
const camDirTmp = new THREE.Vector3(); const storyQuat = new THREE.Quaternion(); const storyStepQuat = new THREE.Quaternion();
let savedRadius = 12, frontRadius = 12;
function prepareStoryCamera() {
    savedOffset.subVectors(savedCameraPos, savedTarget); frontOffset.subVectors(frontCameraPos, frontTarget); savedRadius = savedOffset.length(); frontRadius = getStoryRadius(); // 保留固定文字尺寸，只在窄屏上后移镜头防止截字
    storyQuat.setFromUnitVectors(camDirTmp.copy(savedOffset).normalize(), frontOffset.clone().normalize());
}
function setStoryCamera(blendToFront, radiusOverride) {

    storyStepQuat.identity().slerp(storyQuat, k); camDirTmp.copy(savedOffset).normalize().applyQuaternion(storyStepQuat);
    const radius = radiusOverride ?? THREE.MathUtils.lerp(savedRadius, frontRadius, k); camera.position.copy(camTargetTmp).addScaledVector(camDirTmp, radius);
    controls.target.copy(camTargetTmp); camera.up.set(0, 1, 0); camera.lookAt(camTargetTmp);

const DUR = { charge: 0.18, out: 0.70, hold: 0.22, text: 0.95, textHold: 2.20, back: 1.36, release: 1.10 };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

const smootherStep = t => { t = clamp01(t); return t*t*t*(t*(t*6 - 15) + 10); };
const clamp01 = v => Math.max(0, Math.min(1, v));
function setState(state, el) {
    burstState = state; burstStart = el;
    const phases = { idle:0, charge:1, out:2, hold:3, text:4, textHold:5, back:6, release:0 };
    heartU.uPhase.value = phases[state] ?? 0; heartU.uProgress.value = 0;
    document.body.dataset.state = state;
    replayButton.disabled = state !== 'idle' || paused;
    resetButton.disabled = !['idle', 'release'].includes(state) || paused;
    replayButton.textContent = state === 'idle' ? '再看一次' : '心意送达中…';
    if (state === 'textHold') storyStatus.textContent = LOVE_TEXT + ' 💗';
    else if (state === 'charge') storyStatus.textContent = '正在为洛布汇聚星光';
}
function triggerBurst() {
    if (burstState !== 'idle' || paused || contextLost) return;
    // 清空旋转惯性，避免情书镜头被上一帧的拖动继续推走。
    controls.autoRotate = false;
    const damping = controls.enableDamping;
    controls.enableDamping = false; controls.update(0); controls.enableDamping = damping;
    savedCameraPos.copy(camera.position); savedTarget.copy(controls.target); prepareStoryCamera();
    controls.enabled = false; clearTimeout(tmr);
    setState(reducedMotion ? 'textHold' : 'charge', elapsed);
    if (reducedMotion) { setStoryCamera(1); heart.scale.setScalar(1); }
    if (!reducedMotion && navigator.vibrate) navigator.vibrate(18);
}
function finishReducedStory(el) {
    camera.position.copy(frontCameraPos); controls.target.copy(frontTarget);
    controls.enabled = true; controls.autoRotate = false; controls.update(0);
    heartU.uTextGlow.value = 0; heart.scale.setScalar(1); setState('idle', el);
}
function updateBurst(el, dt) {
    heartU.uFlash.value = 0; heartU.uEnergy.value = 0; heartU.uTextGlow.value = 0;
    starU.uGlow.value *= Math.pow(0.90, dt*60); burstLight.intensity *= Math.pow(0.82, dt*60); flashSprite.material.opacity *= Math.pow(0.78, dt*60);
    if (burstState === 'idle') { heart.scale.setScalar(reducedMotion ? 1 : 1 + Math.sin(el*0.45)*0.006); heartU.uProgress.value = 0; return; }
    const t = el - burstStart;
    if (burstState === 'charge') {
        const p = clamp01(t / DUR.charge), e = easeOutCubic(p); heartU.uProgress.value = p; heartU.uFlash.value = Math.pow(p, 3) * 0.72;
        heartU.uEnergy.value = p * 0.34; heart.scale.setScalar(1 - 0.052 * e); burstLight.intensity = p * 1.5;
        flashSprite.material.opacity = p * 0.16; flashSprite.scale.setScalar(1.2 + p*1.5);
        if (p >= 1) { setState('out', el); shock.visible = true; shock.scale.setScalar(0.08); shock.material.opacity = 0.9; flashSprite.material.opacity = 0.95; flashSprite.scale.setScalar(1.8); burstLight.intensity = 4.0; shake = 1.0; }
    } else if (burstState === 'out') {
        const p = clamp01(t / DUR.out), e = easeOutCubic(p); heartU.uProgress.value = p; heartU.uFlash.value = (1-p) * 0.95;
        heartU.uEnergy.value = 1.0 - p*0.24; heart.scale.setScalar(0.96 + e*0.105); starU.uGlow.value = Math.max(starU.uGlow.value, (1-p)*0.95 + 0.16); burstLight.intensity = (1-p) * 3.8;
        const sw = easeOutCubic(p); shock.scale.setScalar(0.12 + sw * 8.6); shock.material.opacity = Math.pow(1-p, 1.7) * 0.82;
        flashSprite.material.opacity = Math.pow(1-p, 2.2) * 0.86; flashSprite.scale.setScalar(1.8 + p*5.5); shake = Math.max(shake, (1-p) * 0.88);
        if (p >= 1) { shock.visible = false; setState('hold', el); }
    } else if (burstState === 'hold') {
        const p = clamp01(t / DUR.hold); heartU.uProgress.value = p; heartU.uEnergy.value = 0.62 - p*0.12; starU.uGlow.value = Math.max(starU.uGlow.value, 0.18); heart.scale.setScalar(1.055 - p*0.012); if (p >= 1) setState('text', el);
    } else if (burstState === 'text') {
        const p = clamp01(t / DUR.text); setStoryCamera(easeInOutCubic(clamp01(p / 0.48))); heartU.uProgress.value = p;
        heartU.uEnergy.value = (1-p)*0.28 + 0.12; heartU.uTextGlow.value = easeInOutCubic(p); starU.uGlow.value = Math.max(starU.uGlow.value, 0.14 + p*0.12);
        heart.scale.setScalar(1.0); // 文字形成阶段固定整体缩放，避免文字跟随爱心放大
        flashSprite.material.opacity = Math.sin(Math.PI*p)*0.10; flashSprite.scale.setScalar(2.0 + p*1.8); if (p >= 1) setState('textHold', el);
    } else if (burstState === 'textHold') {
        const p = clamp01(t / DUR.textHold); setStoryCamera(1); heartU.uProgress.value = p; heartU.uTextGlow.value = 0.92 + Math.sin(el*3.2)*0.08;
        starU.uGlow.value = Math.max(starU.uGlow.value, 0.22); heart.scale.setScalar(1.0); // 文字停留阶段保持截图基准大小
        if (p >= 1) { if (reducedMotion) finishReducedStory(el); else setState('back', el); }
    } else if (burstState === 'back') {
        const p = clamp01(t / DUR.back); setStoryCamera(1, THREE.MathUtils.lerp(frontRadius, BASE_CAMERA_DISTANCE, smootherStep(p))); heartU.uProgress.value = p; heartU.uEnergy.value = (1-p) * 0.58; heartU.uTextGlow.value = 1-p;
        starU.uGlow.value = Math.max(starU.uGlow.value, (1-p)*0.24); heart.scale.setScalar(1.0); const finishGlow = clamp01((p - 0.82) / 0.18);
        heartU.uFlash.value = finishGlow * 0.42; flashSprite.material.opacity = finishGlow * (1-p) * 1.8; flashSprite.scale.setScalar(0.9 + (1-p)*2.0); burstLight.intensity = finishGlow * (1-p) * 3.0;
        if (p >= 1) { setStoryCamera(1, BASE_CAMERA_DISTANCE); controls.enabled = true; controls.autoRotate = !reducedMotion; controls.autoRotateSpeed = AUTO_ROTATE_SPEED * 0.32; setState('release', el); }
    } else if (burstState === 'release') {
        const p = clamp01(t / DUR.release); controls.autoRotateSpeed = AUTO_ROTATE_SPEED * (0.32 + 0.68 * smootherStep(p));
        heartU.uProgress.value = 0; heartU.uTextGlow.value = 0; heart.scale.setScalar(1.0); heartU.uFlash.value = 0; starU.uGlow.value = Math.max(starU.uGlow.value, (1-p)*0.08);
        if (p >= 1) { controls.autoRotateSpeed = AUTO_ROTATE_SPEED; setState('idle', el); }
    }
}

function applyPixelRatio() {
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, pixelRatioCap));
    heartU.uPixelRatio.value = renderer.getPixelRatio();
    starU.uPixelRatio.value = renderer.getPixelRatio();
}
function animate(timestamp) {
    rafId = null;
    if (hidden || paused || contextLost) return;
    // 不在高刷屏上无上限渲染；计时只累计可见、未暂停的帧。
    const rawDt = lastFrame === null ? 1/60 : (timestamp - lastFrame) / 1000;
    if (rawDt < 1/60 - 0.001) { rafId = requestAnimationFrame(animate); return; }
    lastFrame = timestamp;
    const dt = Math.min(rawDt, 0.05); elapsed += dt;
    updateBurst(elapsed, dt);
    heartU.uTime.value = reducedMotion ? 0 : elapsed; gu.uTime.value = reducedMotion ? 0 : elapsed;
    const starSpeed = burstState === 'out' ? 0.30 : burstState === 'text' ? 0.18 : burstState === 'textHold' ? 0.07 : 0.12;
    if (!reducedMotion) { stars.rotation.y += dt * starSpeed; stars.rotation.x += dt * 0.03; }
    controls.dampingFactor = 1 - Math.pow(1 - 0.08, dt * 60);
    if (controls.enabled) controls.update(dt);
    let sx=0, sy=0, sz=0;
    if (!reducedMotion && shake > 0.002) {
        const amp = 0.055 * shake;
        sx=(Math.random()-0.5)*amp; sy=(Math.random()-0.5)*amp; sz=(Math.random()-0.5)*amp*0.35;
        camera.position.x += sx; camera.position.y += sy; camera.position.z += sz;
        shake *= Math.pow(0.84, dt * 60);
    }
    if (reducedMotion) { shock.visible = false; flashSprite.material.opacity = 0; heartU.uFlash.value = 0; }
    renderer.render(scene, camera);
    camera.position.x -= sx; camera.position.y -= sy; camera.position.z -= sz;
    // 仅持续掉帧才降低像素密度，不削减五万粒子或改变文字形状。
    if (burstState === 'idle' && rawDt < 0.2) { frameSamples++; frameTotal += rawDt; }
    if (elapsed - qualityCheckAt > 5 && frameSamples >= 60) {
        if (frameTotal / frameSamples > 1/38 && pixelRatioCap > 1) {
            pixelRatioCap = Math.max(1, pixelRatioCap - 0.25); applyPixelRatio();

        frameSamples = 0; frameTotal = 0; qualityCheckAt = elapsed;
    }

}
function stopAnimation() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null; lastFrame = null;
}
function startAnimation() {
    if (rafId === null && !hidden && !paused && !contextLost) rafId = requestAnimationFrame(animate);
}
function resizeScene() {
    camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix();
    applyPixelRatio(); renderer.setSize(innerWidth, innerHeight);
    const nextScale = calcHeartScaleForScreen(), ratio = nextScale / HEART_SC;
    for (let k=0; k<pos.length; k++) {
        const old = pos[k]; pos[k] *= ratio; burstPos[k] += pos[k] - old;
    }
    HEART_SC = nextScale;
    geo.attributes.position.needsUpdate = true; geo.attributes.aBurstPosition.needsUpdate = true;
    geo.computeBoundingSphere(); frontRadius = getStoryRadius();
    if (burstState === 'textHold') setStoryCamera(1);
    if (paused && !contextLost) renderer.render(scene, camera);
}
addEventListener('resize', resizeScene, { passive: true });

const raycaster = new THREE.Raycaster(); raycaster.params.Points.threshold = 0.24;
const pointer = new THREE.Vector2(), activePointers = new Set();
let tap = null, multiTouch = false;
renderer.domElement.addEventListener('pointerdown', e => {
    activePointers.add(e.pointerId);
    if (activePointers.size > 1) { multiTouch = true; tap = null; return; }
    tap = e.button === 0 ? { id:e.pointerId, x:e.clientX, y:e.clientY, moved:false, time:performance.now() } : null;
}, { passive:true });
renderer.domElement.addEventListener('pointermove', e => {
    if (tap && e.pointerId === tap.id && Math.hypot(e.clientX-tap.x, e.clientY-tap.y) > 10) tap.moved = true;
}, { passive:true });
renderer.domElement.addEventListener('pointerup', e => {
    const candidate = tap;
    const valid = candidate && candidate.id === e.pointerId && !candidate.moved && !multiTouch &&
        performance.now()-candidate.time < 650 && Math.hypot(e.clientX-candidate.x, e.clientY-candidate.y) <= 10;
    activePointers.delete(e.pointerId); tap = null;
    if (!activePointers.size) multiTouch = false;
    if (!valid || burstState !== 'idle' || paused) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.set((e.clientX-rect.left)/rect.width*2-1, -(e.clientY-rect.top)/rect.height*2+1);
    scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObject(heart, false).length) triggerBurst();
}, { passive:true });
function cancelTap(e) {
    activePointers.delete(e.pointerId); tap = null;
    if (!activePointers.size) multiTouch = false;
}
renderer.domElement.addEventListener('pointercancel', cancelTap, { passive:true });
renderer.domElement.addEventListener('lostpointercapture', cancelTap, { passive:true });
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(tmr); });
controls.addEventListener('end', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => { if (burstState === 'idle' && !paused) controls.autoRotate = !reducedMotion; }, 3000);
});
replayButton.addEventListener('click', triggerBurst);
function resetView() {
    if (paused || !['idle', 'release'].includes(burstState)) return;
    controls.autoRotate = false; controls.enableDamping = false; controls.update(0);
    camera.position.copy(frontCameraPos); controls.target.copy(frontTarget);
    controls.update(0); controls.enableDamping = true; controls.autoRotate = !reducedMotion;
    clearTimeout(tmr);
}
resetButton.addEventListener('click', resetView);
pauseButton.addEventListener('click', () => {
    paused = !paused; pauseButton.textContent = paused ? '继续' : '暂停';
    pauseButton.setAttribute('aria-pressed', String(paused));
    controls.enabled = !paused && ['idle', 'release'].includes(burstState);
    replayButton.disabled = paused || burstState !== 'idle';
    resetButton.disabled = paused || !['idle', 'release'].includes(burstState);
    if (paused) stopAnimation(); else startAnimation();
});
renderer.domElement.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerBurst(); }
    if (e.key === 'Home') { e.preventDefault(); resetView(); }
});
document.addEventListener('visibilitychange', () => {
    hidden = document.hidden; tap = null; activePointers.clear(); multiTouch = false;
    if (hidden) stopAnimation(); else startAnimation();
});
addEventListener('pagehide', stopAnimation);
addEventListener('pageshow', () => { hidden = document.hidden; startAnimation(); });
motionQuery.addEventListener('change', e => {
    reducedMotion = e.matches; shake = 0;
    controls.autoRotate = !reducedMotion && burstState === 'idle';
    if (reducedMotion && !['idle', 'textHold'].includes(burstState)) {
        prepareStoryCamera(); controls.enabled = false; setState('textHold', elapsed); setStoryCamera(1); heart.scale.setScalar(1);
    }
});
renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault(); contextLost = true; stopAnimation();
    window.showHeartError('画面暂时中断，正在尝试恢复；也可以重新加载。');
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    const panel = document.getElementById('loading'); panel.hidden = true; panel.classList.remove('error');
    startAnimation();
});

renderer.render(scene, camera); // 首帧真正渲染完成后才收起加载提示。
clearTimeout(window.heartLoadTimer);
const loading = document.getElementById('loading'); loading.classList.remove('error'); loading.classList.add('hide');
setTimeout(() => { if (!contextLost && loading.classList.contains('hide')) loading.hidden = true; }, 700);
replayButton.disabled = false; resetButton.disabled = false; pauseButton.disabled = false;
document.body.dataset.state = 'idle'; document.body.dataset.ready = 'true';
startAnimation();
console.log('❤️ 洛布辛苦啦 · V3.12 · 50,000 粒子');
} catch (error) {
    clearTimeout(window.heartLoadTimer);
    console.error('爱心初始化失败：', error);
    window.showHeartError('暂时无法点亮爱心。请使用支持 WebGL 的浏览器，或重新加载。');
}

</script>

        navigator.serviceWorker.register('./service-worker.js')
