<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <title>3D 爱心 · 洛布辛苦啦</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050510;overflow:hidden}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;letter-spacing:2px}
  </style>
</head>
<body>
<div id="loading">正在生成 💗</div>
<script>
(async () => {
  try {
    const response = await fetch('./index.html?luobu=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('加载主版本失败');
    let html = await response.text();
    html = html.replaceAll('I LOVE YOU', '洛布辛苦啦');
    html = html.replace('<title>3D 爱心 · 粒子情书 V3.10</title>', '<title>3D 爱心 · 洛布辛苦啦</title>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('loading').textContent = '加载失败，请刷新重试';
    console.error(error);
  }
})();
</script>
</body>
</html>
